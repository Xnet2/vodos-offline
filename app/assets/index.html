<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VODOS</title>
<!-- הפיד של VODOS לנגן, בלי אינטרנט: אותו עיצוב כמו האתר, מהסרטונים שבתיקייה של האפליקציה -->
<style>
:root{--bg:#000;--fg:#fff;--muted:rgba(255,255,255,.75);--accent:#fe2c55;--ink:#161823}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:var(--fg);font-family:Assistant,"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}

.top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;padding:12px 12px 16px;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0));pointer-events:none}
.srcbtn{display:flex;align-items:center;gap:1px;height:30px;padding:0 4px 0 2px;border-radius:999px;font-weight:700;font-size:14.5px;text-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:auto}
.srcbtn span{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcbtn svg{width:20px;height:20px;transition:transform .2s}
.srcbtn[aria-expanded=true] svg{transform:rotate(-90deg)}
.feedtabs{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px;pointer-events:auto}
.feedtabs button{position:relative;padding:5px 0 7px;font-size:15.5px;font-weight:700;color:rgba(255,255,255,.62);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.feedtabs button[aria-selected=true]{color:#fff}
.feedtabs button[aria-selected=true]::after{content:"";position:absolute;bottom:0;left:50%;width:18px;height:2.5px;margin-left:-9px;border-radius:2px;background:#fff}
.menu{position:absolute;top:50px;right:12px;z-index:25;min-width:170px;max-height:70%;overflow-y:auto;padding:6px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:flex;flex-direction:column}
.tab{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border-radius:10px;font-size:15.5px;font-weight:600;text-align:start;white-space:nowrap}
.tab[aria-checked=true]{color:var(--accent)}

.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
.slide video{position:relative;width:100%;height:100%;object-fit:cover;transition:filter .28s ease-out,transform .28s ease-out}
.slide.landscape video{object-fit:contain}
.shade{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.42));pointer-events:none}
.info{position:absolute;right:14px;left:68px;bottom:18px;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.who{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.who b{font-size:16.5px;font-weight:700}
.who time{font-size:13.5px;color:var(--muted)}
.title{font-size:15px;line-height:1.38;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.title b{font-weight:800}
.title.open{display:block;-webkit-line-clamp:unset;max-height:42vh;overflow-y:auto}
.side{position:absolute;left:8px;bottom:22px;z-index:2}
.avatar{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid #fff;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:18px}
.avatar img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#fff}
.slide.outro video{filter:blur(22px) brightness(.7);transform:scale(1.08)}
.outrologo{position:absolute;z-index:2;width:62%;max-width:300px;pointer-events:none;opacity:0;transform:scale(.84);transition:opacity .15s,transform .15s}
.slide.outro .outrologo{opacity:1;transform:none;transition:opacity .48s cubic-bezier(.33,1,.68,1) .12s,transform .48s cubic-bezier(.33,1,.68,1) .12s}
.paused-ico{position:absolute;z-index:3;width:64px;height:64px;opacity:0;transition:opacity .2s;pointer-events:none}
.slide.paused .paused-ico{opacity:.7}
.bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.25);z-index:3;pointer-events:none}
.bar i{display:block;height:100%;width:100%;background:#fff;transform:scaleX(0);transform-origin:right center}
/* העתקה מהמחשב: גלולה לבנה מתחת לראש, עם פס התקדמות; בסוף — "נוספו X סרטונים · הצג" */
.syncpill{position:absolute;z-index:24;top:58px;left:50%;transform:translate(-50%,-12px);min-width:200px;max-width:86%;padding:8px 14px 9px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.28);font-size:13.5px;font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s}
.syncpill.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.syncpill small{display:block;margin-top:1px;font-size:12px;font-weight:600;color:#8a8b91}
.syncpill .track{height:4px;margin-top:7px;border-radius:2px;background:#eceef1;overflow:hidden}
.syncpill .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#25f4ee,#fe2c55);transition:width .4s}
.syncpill.ready{color:var(--accent)}
.syncpill.ready .track{display:none}
/* בהכנה — פס שרץ הלוך ושוב, בלי אחוזים */
.syncpill.busy .track i{width:35%!important;animation:busy 1.2s ease-in-out infinite alternate}
@keyframes busy{from{transform:translateX(0)}to{transform:translateX(-186%)}}
/* טבעת טעינה כמו באתר — מופיעה רק אם הטעינה באמת לוקחת זמן */
.loader{position:absolute;z-index:3;width:44px;height:44px;border-radius:50%;border:7px solid #fff;pointer-events:none;opacity:0;transition:opacity .2s;animation:spin 1s linear infinite}
.loader::before,.loader::after{content:"";position:absolute;top:-7px;left:-7px;right:-7px;bottom:-7px;border-radius:50%;border:7px solid;z-index:-1}
.loader::before{border-color:#25f4ee;transform:translate(-3px,-3px)}
.loader::after{border-color:#fe2c55;transform:translate(3px,3px)}
.slide.loading .loader{opacity:1;transition-delay:.35s}
@keyframes spin{to{transform:rotate(360deg)}}
/* אהבתי — נשמר בנגן גם אחרי שנצפה, ולא נכלל במכסה */
.like{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;font-size:12px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.like svg{width:36px;height:36px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));transition:transform .15s}
.like[aria-pressed=true] svg{fill:var(--accent)}
.like.pop svg{transform:scale(1.25)}
.gear{position:absolute;left:10px;top:12px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.gear svg{width:23px;height:23px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.toast{position:absolute;z-index:30;left:50%;bottom:90px;transform:translateX(-50%);max-width:86%;padding:9px 16px;border-radius:12px;background:rgba(22,24,35,.86);font-size:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sheetbg{position:absolute;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet{width:100%;padding:18px 18px 22px;border-radius:16px 16px 0 0;background:#fff;color:var(--ink)}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet .note{font-size:13px;color:#8a8b91;line-height:1.5;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eceef1}
.row b{display:block;font-size:15px}
.row small{display:block;font-size:12.5px;color:#8a8b91}
.step{display:flex;align-items:center;gap:6px;flex:none;direction:ltr}
.step button{width:34px;height:34px;border-radius:50%;background:#f1f1f2;font-size:20px;font-weight:700;line-height:1}
.step output{min-width:58px;text-align:center;font-weight:800;font-size:15px}
.sheet .done{width:100%;margin-top:12px;padding:11px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.state,.endslide{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);line-height:1.7;font-size:15px}
.state h2,.endslide h2{color:var(--fg);font-size:20px;margin-bottom:6px}
.state img{height:28px;margin-bottom:24px}
</style>
</head>
<body>
<div class="phone">
<header class="top">
  <button class="srcbtn" id="srcBtn" aria-expanded="false"><span id="srcLabel">הכל</span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></button>
  <nav class="feedtabs" id="feedtabs">
    <button type="button" data-feed="latest" aria-selected="true">עדכני</button>
    <button type="button" data-feed="unwatched" aria-selected="false">לא נצפו</button>
    <button type="button" data-feed="liked" aria-selected="false">אהבתי</button>
  </nav>
  <button class="gear" id="gear" type="button" aria-label="הגדרות"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<nav class="menu" id="menu" hidden></nav>
<main class="feed" id="feed"></main>
<button class="syncpill" id="syncpill" type="button"><span id="syncText"></span><small id="syncSub"></small><div class="track"><i id="syncBar"></i></div></button>
<div class="toast" id="toast"></div>
<div class="sheetbg" id="settings" hidden>
  <div class="sheet">
    <h2>הגדרות</h2>
    <p class="note">ההגדרות עוברות למחשב בחיבור הבא. סרטונים שנצפו מתחלפים בחדשים, וסרטונים שסימנתם "אהבתי" נשמרים ולא נכללים במכסה.</p>
    <div class="row"><div><b>נפח במחשב</b><small>כמה סרטונים להוריד ולשמור במחשב</small></div>
      <div class="step"><button type="button" data-k="pcGB" data-d="-1">−</button><output id="pcGB"></output><button type="button" data-k="pcGB" data-d="1">+</button></div></div>
    <div class="row"><div><b>נפח בנגן</b><small>כמה סרטונים להעביר לנגן בכל חיבור</small></div>
      <div class="step"><button type="button" data-k="deviceGB" data-d="-1">−</button><output id="deviceGB"></output><button type="button" data-k="deviceGB" data-d="1">+</button></div></div>
    <button class="done" id="settingsDone" type="button">סגירה</button>
  </div>
</div>
</div>
<script>
(function () {
var PAGE = 8, OUTRO_MS = 1700, WATCHED_MAX = 5000;
var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
var feed = document.getElementById('feed'), menu = document.getElementById('menu');
var srcBtn = document.getElementById('srcBtn'), srcLabel = document.getElementById('srcLabel');

function get(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(t) {
  return esc(t).replace(/\*\*([^*\n](?:[^*]*?[^*\s])?)\s*\*\*/g, '<b>$1</b>').replace(/__([^_\n](?:[^_]*?[^_\s])?)__/g, '<b>$1</b>').replace(/\*\*|__/g, '');
}
function ago(ts) {
  var t = Date.parse(ts); if (!t) return '';
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'עכשיו';
  if (m < 60) return 'לפני ' + m + ' דק׳';
  var h = Math.round(m / 60); if (h < 24) return h === 1 ? 'לפני שעה' : 'לפני ' + h + ' שע׳';
  var d = Math.round(h / 24); if (d < 30) return d === 1 ? 'לפני יום' : 'לפני ' + d + ' ימים';
  return new Date(t).toLocaleDateString('he-IL');
}

// ---- הרשימה מהתיקייה (דרך האפליקציה; בדפדפן במחשב — index.json לבדיקה) ----
var data = {};
try { data = window.VODOS ? JSON.parse(VODOS.index()) : {}; } catch (e) {}
if (window.VODOS && VODOS.immersive) VODOS.immersive();
var base = data.base || '', idx = data.index || {}, sources = idx.sources || {};
var ALL = (idx.videos || []).slice().sort(function (a, b) { return (Date.parse(b.ts) || 0) - (Date.parse(a.ts) || 0); });

var watchedList = get('vod_watched', []), watched = {};
watchedList.forEach(function (k) { watched[k] = 1; });
function markWatched(f) {
  if (watched[f]) return; watched[f] = 1; watchedList.push(f);
  if (watchedList.length > WATCHED_MAX) watchedList.splice(0, watchedList.length - WATCHED_MAX).forEach(function (x) { delete watched[x]; });
  set('vod_watched', watchedList);
  saveState();
}

// אהבתי: [{f,s,t,ts}] — נשמר בנגן גם אחרי שנצפה
var likes = get('vod_likes', []), liked = {};
likes.forEach(function (v) { liked[v.f] = 1; });
function toggleLike(v) {
  if (liked[v.f]) { delete liked[v.f]; likes = likes.filter(function (x) { return x.f !== v.f; }); }
  else { liked[v.f] = 1; likes.push({ f: v.f, s: v.s, t: v.t, ts: v.ts }); toast('נשמר — הסרטון יישאר בנגן'); }
  set('vod_likes', likes);
  saveState(true);
}

var GB_STEPS = [0.5, 1, 2, 3, 4, 6, 8, 12, 16, 24, 32];
var settings = get('vod_settings', { pcGB: 2, deviceGB: 2 });

// מה שהמחשב צריך לדעת מהנגן — נכתב לקובץ בתיקייה של האפליקציה ונקרא בחיבור הבא
var saveTimer = null;
function saveState(now) {
  if (!window.VODOS || !VODOS.saveState) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    saveTimer = null;
    VODOS.saveState(JSON.stringify({
      saved: new Date().toISOString(), settings: settings, likes: likes,
      watched: ALL.filter(function (v) { return watched[v.f]; }).map(function (v) { return v.f; }),
    }));
  }, now ? 0 : 4000);
}

var toastEl = document.getElementById('toast'), toastTimer = null;
function toast(text) {
  toastEl.textContent = text; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
}

var FEEDS = { latest: 1, unwatched: 1, liked: 1 };
var feedMode = get('vod_feed', 'latest'); if (!FEEDS[feedMode]) feedMode = 'latest';
var source = get('vod_source', '');
if (source && !sources[source]) source = '';
var list = [], shown = 0, cur = -1, activeVideo = null, watchTimer = null;
var HEART = '<svg viewBox="0 0 24 24"><path d="M12 21.2l-1.5-1.3C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.5 11.4L12 21.2z"/></svg>';

function avatarHtml(s) {
  var src = sources[s] || {}, a = src.avatar || '', name = src.name || s;
  var url = !a ? '' : /^data:/.test(a) ? a : base + a;
  return '<div class="avatar">' + esc(name.charAt(0)) + (url ? '<img src="' + esc(url) + '" alt="" onerror="this.remove()">' : '') + '</div>';
}

function slide(v) {
  var el = document.createElement('section');
  el.className = 'slide';
  var name = (sources[v.s] || {}).name || v.s;
  el.innerHTML =
    // poster שקוף — אחרת אנדרואיד מציג סמל "נגן" אפור וענק עד שהסרטון נטען
    '<video playsinline preload="none" poster="' + BLANK + '" data-src="' + esc(base + v.f) + '"></video>' +
    '<div class="loader"></div>' +
    '<img class="outrologo" src="logo.png" alt="">' +
    '<svg class="paused-ico" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l10.5-6.5z"/></svg>' +
    '<div class="shade"></div>' +
    '<div class="info"><div class="who"><b>@' + esc(name) + '</b><time>' + ago(v.ts) + '</time></div>' +
    (v.t ? '<p class="title">' + fmt(v.t) + '</p>' : '') + '</div>' +
    '<div class="side"><button class="like" type="button" aria-pressed="' + !!liked[v.f] + '">' + HEART + 'אהבתי</button>' + avatarHtml(v.s) + '</div>' +
    '<div class="bar"><i></i></div>';
  var video = el.querySelector('video'), bar = el.querySelector('.bar i'), title = el.querySelector('.title'), like = el.querySelector('.like');
  video._f = v.f;
  like.addEventListener('click', function (e) {
    e.stopPropagation(); toggleLike(v);
    like.setAttribute('aria-pressed', String(!!liked[v.f]));
    like.classList.add('pop'); setTimeout(function () { like.classList.remove('pop'); }, 160);
  });
  video.addEventListener('loadedmetadata', function () { if (video.videoWidth > video.videoHeight) el.classList.add('landscape'); });
  video.addEventListener('timeupdate', function () { if (video.duration) bar.style.transform = 'scaleX(' + (video.currentTime / video.duration) + ')'; });
  video.addEventListener('ended', function () {
    el.classList.add('outro');
    setTimeout(function () { if (el.classList.contains('outro') && activeVideo === video && video.ended) play(video); }, OUTRO_MS);
  });
  video.addEventListener('play', function () { el.classList.remove('outro', 'paused'); });
  video.addEventListener('waiting', function () { el.classList.add('loading'); });
  video.addEventListener('playing', function () {
    el.classList.remove('loading');
    if (video !== activeVideo) video.pause(); // play() שהתעכב והתחיל אחרי שכבר גללו הלאה
  });
  if (title) title.addEventListener('click', function (e) { e.stopPropagation(); title.classList.toggle('open'); });
  el.addEventListener('click', function () {
    if (!menu.hidden) return closeMenu();
    if (video.paused) play(video); else { video.pause(); el.classList.add('paused'); }
  });
  return el;
}

function play(video) {
  if (video.readyState < 3) video.parentNode.classList.add('loading');
  if (!video.getAttribute('src')) { video.preload = 'auto'; video.src = video.getAttribute('data-src'); }
  if (video.ended) video.currentTime = 0; // רק בסוף — כל השמה ל-currentTime היא קפיצה בקובץ שמעכבת את ההתחלה
  var p = video.play(); if (p && p.catch) p.catch(function () {});
}

function release(video) {
  video.pause();
  if (video.getAttribute('src')) { video.removeAttribute('src'); video.load(); }
}

// איזה סרטון פעיל נקבע לפי מיקום הגלילה: ברגע שעוברים את חצי המסך — הקודם נעצר והחדש מתחיל.
// פתוחים רק שני נגנים בכל רגע (הנוכחי והבא אחריו) — יותר מזה חונק את הנגן והטעינה נמרחת
function setActive(i) {
  var slides = feed.children, el = slides[i];
  if (!el) return;
  cur = i;
  for (var j = 0; j < slides.length; j++) {
    var v = slides[j].querySelector('video');
    if (!v || j === i) continue;
    slides[j].classList.remove('outro', 'paused', 'loading');
    if (j === i + 1) {
      v.pause();
      if (!v.getAttribute('src')) { v.preload = 'auto'; v.src = v.getAttribute('data-src'); } // נטען מראש — המעבר אליו מיידי
    } else release(v);
  }
  var video = el.querySelector('video');
  activeVideo = video;
  clearTimeout(watchTimer);
  if (video) {
    play(video);
    watchTimer = setTimeout(function () { if (activeVideo === video) markWatched(video._f); }, 1500);
  }
  if (i >= shown - 2) more();
}

function onScroll() {
  var h = feed.clientHeight; if (!h) return;
  var i = Math.round(feed.scrollTop / h);
  if (i !== cur) setActive(i);
}
feed.addEventListener('scroll', onScroll, { passive: true });

function more() {
  var end = Math.min(list.length, shown + PAGE);
  for (; shown < end; shown++) feed.appendChild(slide(list[shown]));
  if (shown >= list.length && list.length && !feed.querySelector('.endslide')) {
    var e = document.createElement('div'); e.className = 'endslide';
    e.innerHTML = feedMode === 'liked' ? '<h2>זהו</h2>אלה כל הסרטונים שאהבת'
      : '<h2>' + (feedMode === 'unwatched' ? 'ראית הכל' : 'זהו להפעם') + '</h2>חברו את הנגן למחשב כדי לקבל סרטונים חדשים';
    feed.appendChild(e);
  }
}

function reload() {
  activeVideo = null; cur = -1; clearTimeout(watchTimer);
  Array.prototype.forEach.call(feed.querySelectorAll('video'), release);
  feed.innerHTML = ''; feed.scrollTop = 0; shown = 0;
  list = ALL.filter(function (v) {
    return (!source || v.s === source) && (feedMode !== 'unwatched' || !watched[v.f]) && (feedMode !== 'liked' || liked[v.f]);
  });
  if (!ALL.length) {
    feed.innerHTML = '<div class="state"><img src="logo.png" alt="VODOS"><h2>אין עדיין סרטונים</h2>חברו את הנגן למחשב שבו מותקנת התוכנה "VODOS לנגן", והסרטונים יועתקו אליו אוטומטית.</div>';
    return;
  }
  if (!list.length) {
    feed.innerHTML = feedMode === 'liked'
      ? '<div class="state"><h2>עוד לא סימנת "אהבתי"</h2>סרטון שתסמנו יישמר בנגן גם אחרי שצפיתם בו</div>'
      : '<div class="state"><h2>' + (feedMode === 'unwatched' ? 'ראית הכל' : 'אין סרטונים') + '</h2>חברו את הנגן למחשב כדי לקבל סרטונים חדשים</div>';
    return;
  }
  more();
  setActive(0);
}

// ---- הגדרות: כמה לשמור במחשב וכמה להעביר לנגן ----
var sheet = document.getElementById('settings');
function gb(x) { return (x < 1 ? x * 1000 + 'MB' : x + 'GB'); }
function showSettings() {
  document.getElementById('pcGB').textContent = gb(settings.pcGB);
  document.getElementById('deviceGB').textContent = gb(settings.deviceGB);
}
document.getElementById('gear').addEventListener('click', function () { closeMenu(); showSettings(); sheet.hidden = false; });
document.getElementById('settingsDone').addEventListener('click', function () { sheet.hidden = true; });
sheet.addEventListener('click', function (e) {
  if (e.target === sheet) { sheet.hidden = true; return; }
  var b = e.target.closest('[data-k]'); if (!b) return;
  var k = b.getAttribute('data-k'), i = GB_STEPS.indexOf(settings[k]);
  if (i < 0) i = 2;
  settings[k] = GB_STEPS[Math.max(0, Math.min(GB_STEPS.length - 1, i + +b.getAttribute('data-d')))];
  set('vod_settings', settings); showSettings(); saveState(true);
});

// ---- מקורות ו"עדכני / לא נצפו" ----
function buildMenu() {
  var keys = Object.keys(sources).filter(function (k) { return ALL.some(function (v) { return v.s === k; }); });
  menu.innerHTML = [''].concat(keys).map(function (k) {
    return '<button class="tab" data-src="' + esc(k) + '" aria-checked="' + (k === source) + '">' + esc(k ? sources[k].name : 'הכל') + '</button>';
  }).join('');
  srcLabel.textContent = source ? sources[source].name : 'הכל';
}
function closeMenu() { menu.hidden = true; srcBtn.setAttribute('aria-expanded', 'false'); }
srcBtn.addEventListener('click', function (e) { e.stopPropagation(); menu.hidden = !menu.hidden; srcBtn.setAttribute('aria-expanded', String(!menu.hidden)); });
menu.addEventListener('click', function (e) {
  var b = e.target.closest('.tab'); if (!b) return;
  source = b.getAttribute('data-src'); set('vod_source', source); buildMenu(); closeMenu(); reload();
});
function showTab() {
  Array.prototype.forEach.call(document.querySelectorAll('#feedtabs button'), function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-feed') === feedMode)); });
}
document.getElementById('feedtabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || b.getAttribute('data-feed') === feedMode) return;
  feedMode = b.getAttribute('data-feed'); set('vod_feed', feedMode); showTab(); reload();
});

// ---- העתקה מהמחשב: מה מצב ההעתקה (כל שנייה וחצי) ----
var pill = document.getElementById('syncpill');
function syncStatus() { try { return JSON.parse(VODOS.status()); } catch (e) { return {}; } }
var shownSync = window.VODOS && VODOS.status ? syncStatus() : null;
var loadedId = shownSync && shownSync.finished ? shownSync.id : 0; // העתקה שהסתיימה לפני שהפיד נטען — כבר בפנים
function pollSync() {
  var s = syncStatus();
  pill.classList.remove('ready', 'busy');
  if (s.msg && (s.active || s.error)) { // המחשב בשלב ההכנה (מחובר / מוריד…) או שגיאה
    document.getElementById('syncText').textContent = s.title;
    document.getElementById('syncSub').textContent = s.text;
    pill.classList.add('show', s.error ? 'ready' : 'busy');
  } else if (s.active) {
    document.getElementById('syncText').textContent = 'מעתיק סרטונים מהמחשב…';
    document.getElementById('syncSub').textContent = s.done + ' מתוך ' + s.total + ' · אל תנתקו את הנגן';
    document.getElementById('syncBar').style.width = (s.total ? s.done / s.total * 100 : 0) + '%';
    pill.classList.add('show');
  } else if (s.finished && s.id !== loadedId) {
    document.getElementById('syncText').textContent = s.videos ? 'נוספו ' + s.videos + ' סרטונים חדשים · הצג' : 'הנגן מעודכן ✓';
    document.getElementById('syncSub').textContent = '';
    pill.classList.add('show', 'ready');
  } else pill.classList.remove('show');
}
pill.addEventListener('click', function () { if (pill.classList.contains('ready')) location.reload(); });
if (shownSync) { pollSync(); setInterval(pollSync, 1500); }

window.vodosPause = function () { if (activeVideo) activeVideo.pause(); if (saveTimer) saveState(true); };
window.vodosBack = function () {
  if (!sheet.hidden) { sheet.hidden = true; return true; }
  if (!menu.hidden) { closeMenu(); return true; }
  return false;
};
document.addEventListener('visibilitychange', function () { if (!document.hidden && activeVideo) play(activeVideo); });

buildMenu(); showTab(); reload();
saveState(); // שהמחשב יקבל את ההגדרות גם אם לא שינו כלום
})();
</script>
</body>
</html>
